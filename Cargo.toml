[package]
name = "wflow"
version = "0.3.11"
edition = "2021"
rust-version = "1.88"
authors = ["Wflow Team"]
description = "High-performance native Rust AI voice dictation"

[[bin]]
name = "wflow"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
tonic = { version = "0.12", features = ["tls", "tls-roots", "channel"] }
prost = "0.13"
prost-types = "0.13"
cpal = "0.15"
hound = "3.5"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
semver = "1.0"
fs2 = "0.4"
arboard = "3.4"
anyhow = "1.0"
async-trait = "0.1"
http = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# Already in the tree through egui/epaint. Used directly to inspect the glyph
# coverage of the fonts the GUI loads at start-up.
ab_glyph = "0.2"
sha2 = { version = "0.10", default-features = false, features = ["std"] }
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[features]
# Routes the crate through the stub platform backend so the macOS/other
# build path is type-checked on every CI run.
mock_check = []
# Enables eframe's framebuffer screenshot support (used for UI verification).
screenshot = ["eframe/__screenshot"]

[dev-dependencies]
tempfile = "3.13"

[build-dependencies]
winres = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_ProcessStatus",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_System_Registry",
] }
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["async-io"] }
async-io = "2.6"
x11rb = { version = "0.14", default-features = false, features = ["allow-unsafe-code"] }
