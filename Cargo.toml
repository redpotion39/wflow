[package]
name = "wispr-flow-rust"
version = "0.1.0"
edition = "2021"
authors = ["Wispr Flow Rust Reimplementation"]
description = "High-performance native Rust reimplementation of Wispr Flow AI dictation"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
tonic = { version = "0.12", features = ["tls", "tls-roots", "channel"] }
prost = "0.13"
prost-types = "0.13"
cpal = "0.15"
hound = "3.5"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arboard = "3.4"
anyhow = "1.0"
async-trait = "0.1"
http = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_ProcessStatus",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
] }
