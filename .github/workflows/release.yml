name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  linux:
    name: Build Linux packages
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Ubuntu System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libasound2-dev libssl-dev libx11-dev \
            libxkbcommon-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev \
            xdotool dpkg-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Read version
        id: version
        run: |
          echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Build all Linux packages
        run: bash packaging/linux/build-all.sh

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ./*.deb ./*.run ./*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Debian Package
        uses: actions/upload-artifact@v7
        with:
          name: wflow-linux-deb
          path: dist/*.deb

      - name: Upload Universal .run Installer
        uses: actions/upload-artifact@v7
        with:
          name: wflow-linux-run-installer
          path: dist/*.run

      - name: Upload Linux Tarball
        uses: actions/upload-artifact@v7
        with:
          name: wflow-linux-tarball
          path: dist/*.tar.gz

      - name: Upload Checksums
        uses: actions/upload-artifact@v7
        with:
          name: wflow-checksums
          path: dist/SHA256SUMS.txt

  windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe",
                                 "C:\Program Files\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
                   Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup" }
          "ISCC=$($iscc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compile Setup.exe
        shell: pwsh
        run: |
          # The version in the Inno Setup script is a placeholder so that it
          # always matches the one in Cargo.toml.
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"$').Matches[0].Groups[1].Value
          (Get-Content installer.iss) -replace '@VERSION@', $version | Set-Content installer.iss
          & $env:ISCC installer.iss
          Get-ChildItem dist

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item dist\Wflow-Setup-*.exe dist\ -ErrorAction SilentlyContinue
          Get-ChildItem dist

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: wflow-windows-setup
          path: dist/*.exe

  publish:
    name: Publish GitHub Release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' 
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      # The Linux job can only hash the files it built. The in-app updater
      # verifies whatever it downloads against this manifest, Windows
      # installer included, so the manifest has to be rebuilt from the merged
      # artifact set instead of reusing the Linux-only one.
      - name: Generate combined checksums
        run: |
          cd artifacts
          sha256sum ./*.deb ./*.run ./*.tar.gz ./*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.deb
            artifacts/*.run
            artifacts/*.tar.gz
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ## Verification

            ```bash
            sha256sum -c SHA256SUMS.txt
            ```

            The checksum file covers every artifact, including the Windows
            installer, which can also be checked on its own with
            `Get-FileHash Wflow-Setup-<version>.exe -Algorithm SHA256`.
