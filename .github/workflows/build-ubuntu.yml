name: Build Ubuntu Installer (.deb)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-ubuntu:
    name: Build Ubuntu (.deb & tarball)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ubuntu System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libasound2-dev \
            libssl-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libgl1-mesa-dev \
            xdotool \
            dpkg-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build Release Binary
        run: cargo build --release

      - name: Build Debian Package (.deb)
        run: bash packaging/linux/build-deb.sh

      - name: Create Tarball Archive
        run: |
          mkdir -p dist
          tar -czvf dist/wflow-0.1.0-linux-x86_64.tar.gz \
            -C target/release wflow \
            -C ../../assets icon_256.png \
            -C ../../packaging/linux wflow.desktop \
            -C ../.. install.sh uninstall.sh

      - name: Upload Debian Package (.deb) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wflow-ubuntu-deb
          path: dist/*.deb

      - name: Upload Linux Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wflow-linux-tarball
          path: dist/*.tar.gz
