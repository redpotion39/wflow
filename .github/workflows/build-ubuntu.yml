name: Build Linux Installers (.deb, .run & tarball)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux Installers
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ubuntu System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libasound2-dev \
            libssl-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libgl1-mesa-dev \
            xdotool \
            dpkg-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build All Linux Packages (.deb, .run, .tar.gz)
        run: bash packaging/linux/build-all.sh

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ./*.deb ./*.run ./*.tar.gz > SHA256SUMS.txt

      - name: Upload Debian Package (.deb) Artifact
        uses: actions/upload-artifact@v7
        with:
          name: wflow-ubuntu-deb
          path: dist/*.deb

      - name: Upload Universal .run Installer Artifact
        uses: actions/upload-artifact@v7
        with:
          name: wflow-linux-run-installer
          path: dist/*.run

      - name: Upload Linux Tarball Artifact
        uses: actions/upload-artifact@v7
        with:
          name: wflow-linux-tarball
          path: dist/*.tar.gz
